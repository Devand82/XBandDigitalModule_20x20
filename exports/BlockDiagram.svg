<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="monospace" font-size="11">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9333ea"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">X-Band Digital Module 20x20cm — Schema a Blocchi</text>
  <text x="600" y="52" text-anchor="middle" font-size="11" fill="#64748b">ADC12DJ5200-SP → JESD204C → XQRVC1902-SP FPGA → DDC → SpaceWire</text>

  <!-- ===== RF INPUT ===== -->
  <rect x="30" y="120" width="110" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="85" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">RF INPUT</text>
  <text x="85" y="156" text-anchor="middle" font-size="9" fill="#3b82f6">J2 SMA 50Ω</text>
  <text x="85" y="168" text-anchor="middle" font-size="9" fill="#3b82f6">R1 50Ω C1 C2</text>

  <!-- ===== ADC ===== -->
  <rect x="200" y="80" width="160" height="140" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="280" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">U1 ADC12DJ5200-SP</text>
  <text x="280" y="118" text-anchor="middle" font-size="9" fill="#a16207">12-bit 500MSPS ADC</text>
  <line x1="210" y1="128" x2="350" y2="128" stroke="#d97706" stroke-width="0.5" stroke-dasharray="3"/>
  <text x="215" y="140" font-size="8" fill="#92400e">INA+/INA- RF input</text>
  <text x="215" y="152" font-size="8" fill="#92400e">CLK+/CLK- Clock</text>
  <text x="215" y="164" font-size="8" fill="#92400e">SYSREF+/SYSREF-</text>
  <text x="215" y="176" font-size="8" fill="#92400e">CS/SCLK/SDI/SDO SPI</text>
  <text x="215" y="188" font-size="8" fill="#92400e">DA0-DA3 JESD204C</text>
  <text x="215" y="200" font-size="8" fill="#92400e">VA11/VA19/VD11 Power</text>
  <text x="215" y="212" font-size="8" fill="#92400e">C10-C18 Decoupling</text>

  <!-- ===== FPGA ===== -->
  <rect x="430" y="80" width="170" height="140" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="515" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">U2 XQRVC1902-SP</text>
  <text x="515" y="118" text-anchor="middle" font-size="9" fill="#16a34a">Rad-Hard FPGA</text>
  <line x1="440" y1="128" x2="590" y2="128" stroke="#16a34a" stroke-width="0.5" stroke-dasharray="3"/>
  <text x="445" y="140" font-size="8" fill="#166534">JESD204C Receiver</text>
  <text x="445" y="152" font-size="8" fill="#166534">DDC (Digital Down Conv)</text>
  <text x="445" y="164" font-size="8" fill="#166534">SPI Master</text>
  <text x="445" y="176" font-size="8" fill="#166534">SpaceWire TX1/TX2</text>
  <text x="445" y="188" font-size="8" fill="#166534">Clock Management</text>
  <text x="445" y="200" font-size="8" fill="#166534">VCCINT/VCCAUX/VCCO</text>
  <text x="445" y="212" font-size="8" fill="#166534">C20-C25 Decoupling</text>

  <!-- ===== CLOCK ===== -->
  <rect x="430" y="280" width="170" height="130" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="515" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">CLOCK DISTRIBUTION</text>
  <line x1="440" y1="310" x2="590" y2="310" stroke="#9333ea" stroke-width="0.5" stroke-dasharray="3"/>
  <text x="445" y="324" font-size="9" fill="#6b21a8">Y1 CVHD-950 VCXO</text>
  <text x="445" y="338" font-size="9" fill="#6b21a8">U3 LMX2615-SP PLL</text>
  <text x="445" y="352" font-size="9" fill="#6b21a8">U4 LMK04832-SP Clock IC</text>
  <text x="445" y="366" font-size="8" fill="#6b21a8">C40-C67 Decoupling</text>
  <text x="445" y="380" font-size="8" fill="#6b21a8">R30-R38 FS/Config</text>
  <text x="445" y="394" font-size="8" fill="#6b21a8">C52-C53 Loop Filter</text>

  <!-- ===== POWER INPUT ===== -->
  <rect x="30" y="430" width="130" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="95" y="452" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">POWER INPUT</text>
  <text x="95" y="466" text-anchor="middle" font-size="9" fill="#dc2626">J1 Power Connector</text>
  <text x="95" y="478" font-size="8" fill="#dc2626">D1 TVS SMBJ6.0A</text>
  <text x="95" y="490" font-size="8" fill="#dc2626">C100-C102 Bulk Caps</text>
  <text x="95" y="502" font-size="8" fill="#dc2626">R100 10mΩ Shunt</text>

  <!-- ===== CURRENT SENSE ===== -->
  <rect x="200" y="440" width="120" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="260" y="460" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">U10 INA214-SP</text>
  <text x="260" y="474" text-anchor="middle" font-size="8" fill="#a16207">Current Sense Amp</text>
  <text x="260" y="486" font-size="8" fill="#a16207">R101 C103 Filter</text>

  <!-- ===== SEQUENCER ===== -->
  <rect x="370" y="440" width="150" height="70" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="445" y="458" text-anchor="middle" font-size="11" font-weight="bold" fill="#9d174d">SEQUENCER</text>
  <text x="445" y="472" text-anchor="middle" font-size="9" fill="#db2777">U13A/B TPS7H3014-SP</text>
  <text x="445" y="486" font-size="8" fill="#db2777">EN_BUCK1-3 EN_LDO1-3</text>
  <text x="445" y="498" font-size="8" fill="#db2777">C120-C124 R70-R73</text>

  <!-- ===== BUCK 1V0 ===== -->
  <rect x="200" y="570" width="140" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="270" y="590" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">BUCK 1.0V</text>
  <text x="270" y="604" text-anchor="middle" font-size="9" fill="#3b82f6">U5 TPS7H5001-SP</text>
  <text x="270" y="618" font-size="8" fill="#3b82f6">Buck1L1 100nH</text>
  <text x="270" y="630" font-size="8" fill="#3b82f6">Buck1C1-C22</text>

  <!-- ===== BUCK 1V8 ===== -->
  <rect x="380" y="570" width="140" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="590" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">BUCK 1.8V</text>
  <text x="450" y="604" text-anchor="middle" font-size="9" fill="#3b82f6">U6 ISL70003ASEH</text>
  <text x="450" y="618" font-size="8" fill="#3b82f6">L1 2.2µH FB2</text>
  <text x="450" y="630" font-size="8" fill="#3b82f6">C70-C78 R50-R52</text>

  <!-- ===== BUCK 3V3 ===== -->
  <rect x="560" y="570" width="140" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="630" y="590" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">BUCK 3.3V</text>
  <text x="630" y="604" text-anchor="middle" font-size="9" fill="#3b82f6">U7 ISL70003ASEH</text>
  <text x="630" y="618" font-size="8" fill="#3b82f6">L2 4.7µH FB3</text>
  <text x="630" y="630" font-size="8" fill="#3b82f6">C80-C88 R53-R55</text>

  <!-- ===== LDO 1V0 ===== -->
  <rect x="740" y="570" width="120" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="800" y="590" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">LDO 1.0V</text>
  <text x="800" y="604" text-anchor="middle" font-size="8" fill="#16a34a">U8 TPS7H1111-SP</text>
  <text x="800" y="616" font-size="8" fill="#16a34a">C90-C94 R60-R61</text>

  <!-- ===== LDO 1V8 ===== -->
  <rect x="890" y="570" width="120" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="950" y="590" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">LDO 1.8V</text>
  <text x="950" y="604" text-anchor="middle" font-size="8" fill="#16a34a">U9 TPS7H1111-SP</text>
  <text x="950" y="616" font-size="8" fill="#16a34a">C95-C99 R62-R63</text>

  <!-- ===== LDO 2V5 ===== -->
  <rect x="740" y="660" width="120" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="800" y="680" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">LDO 2.5V</text>
  <text x="800" y="694" text-anchor="middle" font-size="8" fill="#16a34a">U10 TPS7H1121-SP</text>
  <text x="800" y="706" font-size="8" fill="#16a34a">C110-C116 R64-R65</text>

  <!-- ===== CONNECTORS ===== -->
  <rect x="950" y="80" width="130" height="140" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="1015" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">CONNECTORS</text>
  <line x1="960" y1="108" x2="1070" y2="108" stroke="#475569" stroke-width="0.5" stroke-dasharray="3"/>
  <text x="960" y="122" font-size="8" fill="#475569">J2 JESD Debug</text>
  <text x="960" y="134" font-size="8" fill="#475569">J3 SPW Port 1</text>
  <text x="960" y="146" font-size="8" fill="#475569">J4 SPW Port 2</text>
  <text x="960" y="158" font-size="8" fill="#475569">J5 JTAG (6-pin)</text>
  <text x="960" y="170" font-size="8" fill="#475569">J6 SPI Debug</text>
  <text x="960" y="182" font-size="8" fill="#475569">TP1-TP16 Test Pts</text>
  <text x="960" y="194" font-size="8" fill="#475569">DC40-DC240 Decoup</text>
  <text x="960" y="206" font-size="8" fill="#475569">R10-R13 Config</text>

  <!-- ===== ARROWS: RF → ADC ===== -->
  <line x1="140" y1="150" x2="195" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="155" y="130" font-size="8" fill="#2563eb" font-weight="bold">RF_IN</text>

  <!-- ===== ARROWS: ADC ↔ FPGA (JESD204C) ===== -->
  <line x1="365" y1="110" x2="425" y2="110" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <line x1="425" y1="130" x2="365" y2="130" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="395" y="104" text-anchor="middle" font-size="8" fill="#16a34a" font-weight="bold">JESD204C</text>
  <text x="395" y="96" text-anchor="middle" font-size="7" fill="#16a34a">DA0-DA3 P/N</text>
  <text x="395" y="88" text-anchor="middle" font-size="7" fill="#16a34a">4 Lanes Diff</text>

  <!-- ===== ARROWS: ADC ↔ FPGA (SPI) ===== -->
  <line x1="365" y1="170" x2="425" y2="170" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <line x1="425" y1="180" x2="365" y2="180" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="395" y="192" text-anchor="middle" font-size="7" fill="#d97706">SPI: CS/SCK/MOSI/MISO</text>

  <!-- ===== ARROWS: Clock → ADC ===== -->
  <line x1="430" y1="340" x2="365" y2="160" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="380" y="240" font-size="7" fill="#9333ea" transform="rotate(-55 380 240)">ADC_CLK_P/N</text>
  <text x="375" y="250" font-size="7" fill="#9333ea" transform="rotate(-55 375 250)">ADC_SYSREF_P/N</text>

  <!-- ===== ARROWS: Clock → FPGA ===== -->
  <line x1="515" y1="280" x2="515" y2="225" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="525" y="255" font-size="7" fill="#9333ea">FPGA_REFCLK_P/N</text>
  <text x="525" y="265" font-size="7" fill="#9333ea">FPGA_SPWCLK_P/N</text>

  <!-- ===== ARROWS: FPGA → Clock (SPI/Control) ===== -->
  <line x1="535" y1="220" x2="535" y2="275" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="555" y="250" font-size="7" fill="#d97706">SPI_CS_LMX/LMK</text>
  <text x="555" y="260" font-size="7" fill="#d97706">LMK_RESET/LMK_SYNC</text>
  <text x="555" y="270" font-size="7" fill="#d97706">LMX_CAL/LMX_SYNC</text>

  <!-- ===== ARROWS: Power Input → Buck/LDO ===== -->
  <line x1="95" y1="510" x2="95" y2="565" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="105" y="540" font-size="8" fill="#dc2626" font-weight="bold">VIN 4.5V</text>

  <!-- ===== ARROWS: Buck → Power Rails ===== -->
  <line x1="270" y1="640" x2="270" y2="670" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="270" y="685" text-anchor="middle" font-size="8" fill="#2563eb" font-weight="bold">VCCINT 1.0V</text>

  <line x1="450" y1="640" x2="450" y2="670" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="450" y="685" text-anchor="middle" font-size="8" fill="#2563eb" font-weight="bold">VCCAUX 1.8V</text>

  <line x1="630" y1="640" x2="630" y2="670" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="630" y="685" text-anchor="middle" font-size="8" fill="#2563eb" font-weight="bold">VCCIO 3.3V</text>

  <!-- ===== ARROWS: LDO outputs ===== -->
  <line x1="800" y1="630" x2="800" y2="655" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="800" y="650" text-anchor="middle" font-size="7" fill="#16a34a">+1V0_ANA</text>

  <line x1="950" y1="630" x2="950" y2="655" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="950" y="650" text-anchor="middle" font-size="7" fill="#16a34a">+1V8_ANA</text>

  <!-- ===== ARROWS: SpaceWire ===== -->
  <line x1="605" y1="180" x2="945" y2="140" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="780" y="148" font-size="8" fill="#ea580c" font-weight="bold">SpaceWire TX1/TX2</text>

  <!-- ===== ARROWS: Sequencer → Power Enable ===== -->
  <line x1="445" y1="440" x2="270" y2="565" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-purple)"/>
  <line x1="445" y1="440" x2="450" y2="565" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-purple)"/>
  <line x1="445" y1="440" x2="630" y2="565" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-purple)"/>
  <text x="340" y="520" font-size="7" fill="#db2777">EN_BUCK1-3</text>
  <text x="520" y="520" font-size="7" fill="#db2777">EN_LDO1-3</text>

  <!-- ===== LEGEND ===== -->
  <rect x="30" y="750" width="1140" height="130" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="600" y="770" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">LEGENDA</text>

  <!-- Legend items -->
  <line x1="50" y1="790" x2="90" y2="790" stroke="#2563eb" stroke-width="2.5"/>
  <text x="100" y="794" font-size="9" fill="#334155">JESD204C (ADC ↔ FPGA)</text>

  <line x1="50" y1="810" x2="90" y2="810" stroke="#d97706" stroke-width="1.5"/>
  <text x="100" y="814" font-size="9" fill="#334155">SPI Bus (FPGA → ADC/PLL/Clock)</text>

  <line x1="50" y1="830" x2="90" y2="830" stroke="#9333ea" stroke-width="1.5"/>
  <text x="100" y="834" font-size="9" fill="#334155">Clock (LMK → ADC/FPGA)</text>

  <line x1="50" y1="850" x2="90" y2="850" stroke="#dc2626" stroke-width="2"/>
  <text x="100" y="854" font-size="9" fill="#334155">Power (VIN 4.5V)</text>

  <line x1="50" y1="870" x2="90" y2="870" stroke="#16a34a" stroke-width="1.5"/>
  <text x="100" y="874" font-size="9" fill="#334155">Power Rails (+3V3/+1V0/+1V8/+2V5)</text>

  <line x1="350" y1="790" x2="390" y2="790" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="794" font-size="9" fill="#334155">SpaceWire (FPGA → Connectors)</text>

  <line x1="350" y1="810" x2="390" y2="810" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="400" y="814" font-size="9" fill="#334155">Power Sequencing (Enable)</text>

  <rect x="350" y="825" width="40" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="400" y="836" font-size="9" fill="#334155">Buck Converter</text>

  <rect x="350" y="845" width="40" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="400" y="856" font-size="9" fill="#334155">LDO / FPGA</text>

  <rect x="350" y="865" width="40" height="14" rx="3" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="400" y="876" font-size="9" fill="#334155">Clock Distribution</text>

  <!-- Stats -->
  <text x="750" y="794" font-size="9" fill="#334155" font-weight="bold">STATISTICHE:</text>
  <text x="750" y="810" font-size="9" fill="#334155">186 componenti totali</text>
  <text x="750" y="826" font-size="9" fill="#334155">12 ICs (ADC, FPGA, PLL, Clock, 3×Buck, 3×LDO, Seq, Sense)</text>
  <text x="750" y="842" font-size="9" fill="#334155">89 C + 32 R + 2 L + 3 FB + 12 D = 138 passivi</text>
  <text x="750" y="858" font-size="9" fill="#334155">398 reti, 867 pin connections</text>
  <text x="750" y="874" font-size="9" fill="#334155">52 reti cross-sheet, 24/24 segnali critici OK</text>
</svg>
